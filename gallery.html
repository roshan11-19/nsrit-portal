<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>NSRIT Gallery</title>

<link rel="stylesheet" href="css/style.css">

<script defer src="js/gallery.js"></script>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<div class="min-h-screen py-10"
     style="background:linear-gradient(135deg,#fff5f5 0%,#ffe5e5 45%,#ffd6d6 100%);">

<div class="max-w-7xl mx-auto p-8">

<div class="flex justify-between items-center">

<div>

<h1 class="text-5xl font-bold text-red-700">

📷 NSRIT Gallery

</h1>

<p class="text-gray-600">

College Events and Campus Memories

</p>

</div>

<a href="index.html"

class="bg-red-700 text-white px-6 py-3 rounded-full">

← Return Home

</a>

</div>

<div id="gallery"

class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-10">

</div>

</div>

<!-- Popup -->

<div id="popup"

class="hidden fixed inset-0 bg-black/70 flex justify-center items-center">

<div class="bg-white rounded-xl overflow-hidden max-w-5xl">

<div class="flex justify-between p-4">

<h2 id="popupTitle"

class="text-2xl font-bold">

</h2>

<button onclick="closePopup()"

class="text-4xl">

×

</button>

</div>

<img id="popupImage"

class="w-full">

<p id="popupDescription"

class="p-5 text-lg">

</p>

</div>

</div>

</body>

</html>
